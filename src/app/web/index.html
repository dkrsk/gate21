<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School 21 auth</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #161b22;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { margin: 0 0 24px; color: #8b949e; font-size: 14px; }
    label { display: block; margin-bottom: 6px; color: #8b949e; font-size: 13px; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #238636;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .err {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(248, 81, 73, .15);
      border: 1px solid #f85149;
      color: #ffa198;
      font-size: 14px;
    }
    .ok {
      display: none;
      padding-top: 8px;
      color: #3fb950;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <h1>School 21</h1>
    <p class="sub">Введите логин и пароль для продолжения</p>
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Войти</button>
    <div class="err" id="error" role="alert"></div>
    <div class="ok" id="done" role="status">Вход подтверждён. Можно вернуться в бота.</div>
  </form>
  <script src="/app.js"></script>
</body>
</html>
